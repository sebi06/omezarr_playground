[workspace]
name = "omezarr"
version = "0.0.1"
description = "Playground for converting Carl Zeiss Image (CZI) files to OME-ZARR format"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[environments]
omezarr = { features = ["default"], solve-group = "default" }

[dependencies]
python = "3.12.*"
altair = "*"
colormap = "*"
dask = "*"
dask-image = "*"
grpclib = "*"
fsspec = "*"
ipyfilechooser = "*"
ipykernel = "*"
matplotlib = ">=3.7.0"
numpy = "*"
pandas = "<3"
pytest = "*"
requests = "*"
scikit-image = ">=0.26.0"
seaborn = ">=0.13.2"
setuptools = "*"
tqdm = "*"
validators = "*"
wheel = "*"
xarray = ">=2026.2.0"
xmltodict = "*"
wordcloud = "*"
ome-zarr-models = ">=1.7,<2"

[pypi-dependencies]
# Local package (editable install)
czi-omezarr-utils = {path = ".", editable = true}

# CZI readers
aicspylibczi = ">=3.3.1"
czitools = ">=0.17.2"
czifile = ">=2026.4.30"

# BioIO ecosystem
bioio = "*"
bioio-czi = "*"
bioio-ome-zarr = "*"
bioio-conversion = "*"

# OME-ZARR ecosystem
ngff-zarr = ">=0.34.0"
ome-zarr = ">=0.16.0"
ome-writers = {version = ">=0.3.2", extras = ["acquire-zarr"]}

# napari + GUI (moved from conda to avoid superqt 0.8.0 pin from conda-forge)
napari = ">=0.7.0"
magicgui = "*"

# napari plugins
napari-crop = "*"
napari-czitools = ">=0.0.11"
napari-layer-statistics = "*"
napari-ome-zarr = ">=0.8.0"
napari-skimage-regionprops = "*"

# Other utilities
df2tables = "*"
loguru = "*"
marimo = "*"
ngio = ">=0.5.10"
pip-system-certs = "*"
betterproto = {version = ">=2.0.0b7", extras = ["compiler"]}
ndv = {version = ">=0.5.0", extras = ["vispy", "pyqt"]}

[tasks]
# Launch the MagicGUI converter application
gui = {cmd = "python scripts/run_czi_converter_gui.py", description = "Launch the CZI-to-OME-ZARR GUI"}

# start Napari with the zen-python environment
start-napari = {cmd = "napari"}

# Run the HCS plate conversion example
convert-hcs = {cmd = "python scripts/convert2hcs_omezarr.py", description = "Run HCS plate conversion CLI"}

# Run the standard OME-ZARR creation example
convert = {cmd = "python scripts/create_omezarr_example.py", description = "Run standard OME-ZARR conversion example"}

# Run the HCS plate processing example
process = {cmd = "python scripts/process_hcsplate_example.py", description = "Run HCS plate analysis example"}

# Validate an existing OME-ZARR store
validate = {cmd = "python scripts/validate_omezarr.py", description = "Validate an OME-ZARR store"}

# Launch Marimo notebooks
marimo-convert = {cmd = "marimo run notebooks/create_omezarr_marimo.py", description = "Run OME-ZARR conversion Marimo notebook"}
marimo-heatmap = {cmd = "marimo run notebooks/visualize_omezarr_heatmap_marimo.py", description = "Run heatmap visualisation Marimo notebook"}
marimo-edit = {cmd = "marimo edit", description = "Open Marimo in edit mode"}
